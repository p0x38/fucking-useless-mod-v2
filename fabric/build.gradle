plugins {
    id 'com.gradleup.shadow'
}

architectury {
    platformSetupLoomIde()
    fabric()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }

    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common

    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

dependencies {
    modImplementation "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"
    modImplementation "net.fabricmc.fabric-api:fabric-api:$rootProject.fabric_api_version"
    modImplementation "dev.architectury:architectury-fabric:$rootProject.architectury_api_version"

    // Cloth Config is used by the platform-specific config screen.
    modCompileOnly("me.shedaniel.cloth:cloth-config-fabric:$rootProject.cloth_config_version") {
        exclude group: "net.fabricmc.fabric-api"
    }
    modRuntimeOnly("me.shedaniel.cloth:cloth-config-fabric:$rootProject.cloth_config_version") {
        exclude group: "net.fabricmc.fabric-api"
    }

    modImplementation "com.terraformersmc:modmenu:$rootProject.modmenu_version"

    // Text Placeholder API 2.8.2+1.21.10 supports Minecraft 1.21.11.
    modImplementation "curse.maven:text-placeholder-api-1037459:7562935"

    modRuntimeOnly "me.djtheredstoner:DevAuth-fabric:$rootProject.devauth_version"

    // Sodium 0.8.14 for Fabric 1.21.11.
    modRuntimeOnly "curse.maven:sodium-394468:8756612"

    common(project(path: ':common', configuration: 'namedElements')) {
        transitive = false
    }

    shadowBundle project(
            path: ':common',
            configuration: 'transformProductionFabric'
    )
}

processResources {
    inputs.property 'version', project.version
    inputs.property 'loader_version', rootProject.fabric_loader_version

    filesMatching('fabric.mod.json') {
        expand(
                version: project.version,
                loader_version: rootProject.fabric_loader_version
        )
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    inputFile.set shadowJar.archiveFile
}
