plugins {
    id 'com.gradleup.shadow'
}

architectury {
    platformSetupLoomIde()
    fabric()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }

    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common

    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

dependencies {
    modImplementation "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"
    modImplementation "net.fabricmc.fabric-api:fabric-api:$rootProject.fabric_api_version"
    modImplementation "dev.architectury:architectury-fabric:$rootProject.architectury_api_version"

    modImplementation("me.shedaniel.cloth:cloth-config-fabric:$rootProject.cloth_config_fabric_version") {
        exclude group: "net.fabricmc.fabric-api"
    }

    modImplementation "maven.modrinth:mOgUt4GM:cLkYaVuL"
    modImplementation "maven.modrinth:eXts2L7r:$rootProject.placeholder_api_version"

    modRuntimeOnly("me.djtheredstoner:DevAuth-fabric:$rootProject.devauth_version") {
        exclude group: "net.fabricmc", module: "fabric-loader"
    }

    modRuntimeOnly "maven.modrinth:AANobbMI:$rootProject.sodium_fabric_version"

    common(project(path: ':common', configuration: 'namedElements')) {
        transitive = false
    }

    shadowBundle project(
            path: ':common',
            configuration: 'transformProductionFabric'
    )
}

processResources {
    inputs.property 'version', project.version
    inputs.property 'loader_version', rootProject.fabric_loader_version

    filesMatching('fabric.mod.json') {
        expand(
                version: project.version,
                loader_version: rootProject.fabric_loader_version
        )
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    inputFile.set shadowJar.archiveFile
}
